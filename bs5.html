<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-secondary">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="card shadow rounder-4">
                    <div class="card-body p-4">
                        <h2 class="text-center text-secondary mb-2">Welcome to LasyShop</h2>
                        <p class="text-center text-secondary mb-4">Login to your account</p>
                        <form>
                            <div class="mb-3">
                                <label for="Email" class="form-label">Email</label>
                                <input type="Email" class="form-control" id="Email" placeholder="Enter Your Email" required/>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter Your Password" required/>
                            </div>
                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input" id="remember"/>
                                <label class="form-check-label" for="remember">Remember Me</label>
                            </div>
                            <div class="text-end mb-3">
                                <a href="#" class="text-decoraction-none">Forget Password</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <p class="text-center mt-4 mb-0">Don't have account?
                            <a href="#" class="text-decoraction-none fw-bold">Register</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
